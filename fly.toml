# fly.toml app configuration file generated for flyio-surrealdb on 2026-08-04T21:21:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flyio-surrealdb'
primary_region = 'nrt'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
